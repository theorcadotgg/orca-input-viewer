[package]
name = "orca_input_viewer"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
crc32c = "0.6"
rusb = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
sysinfo = "0.30"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tiny_http = "0.12"
tungstenite = "0.21"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["memoryapi", "processthreadsapi", "tlhelp32", "handleapi", "winnt"] }

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.4"
