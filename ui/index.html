<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orca Input Viewer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <header class="app-header">
          <div class="app-title">
            <h1>Orca Input Viewer</h1>
            <span class="app-version" id="appVersion"></span>
          </div>
          <div class="status-row">
            <span class="status-chip" id="adapterChip" data-state="offline" title="Adapter not connected">
              <span class="status-dot" id="adapterDot"></span>
              <span id="adapterStatus">Offline</span>
            </span>
            <span class="status-chip" id="configChip" data-state="default" title="Using built-in default mappings">
              <span class="status-dot" id="configDot"></span>
              <span id="configStatus">Default mappings</span>
            </span>
            <span class="status-chip mode hidden" id="inputMode"></span>
          </div>
        </header>

        <div class="sidebar-body">
          <section class="panel">
            <h2 class="panel-title">Connection</h2>

            <div class="field-row">
              <label class="field">
                <span class="field-label">Port</span>
                <select class="select" id="portSelect"></select>
              </label>
              <label class="field">
                <span class="field-label">Profile</span>
                <select class="select" id="profileSelect"></select>
              </label>
            </div>

            <div class="field">
              <span class="field-label" id="inputModeLabel">Input mode</span>
              <div class="segmented" role="group" aria-labelledby="inputModeLabel">
                <button class="seg-btn" id="modeDolphin" data-mode="dolphin" type="button" aria-pressed="true">Dolphin</button>
                <button class="seg-btn" id="modeStandalone" data-mode="usb" type="button" aria-pressed="false">Standalone</button>
              </div>
            </div>

            <button class="btn primary block" id="streamButton" type="button">Start Stream</button>
            <p class="notice hidden" id="connectionNotice" role="status" aria-live="polite"></p>
            <button class="btn block hidden" id="enableMacAccess" type="button">Enable macOS Access</button>
          </section>

          <section class="panel">
            <h2 class="panel-title">Device config</h2>
            <button class="btn block" id="loadConfig" type="button">Load Device Config</button>
            <p class="notice" id="configNotice" role="status" aria-live="polite">Put Orca in config mode to sync.</p>
          </section>

          <section class="panel">
            <h2 class="panel-title">Outputs</h2>

            <div class="group">
              <span class="field-label">Overlay window</span>
              <div class="button-pair">
                <button class="btn" id="showOverlay" type="button">Show</button>
                <button class="btn" id="hideOverlay" type="button">Hide</button>
              </div>
            </div>

            <div class="group">
              <span class="field-label">OBS browser source</span>
              <div class="button-pair">
                <button class="btn" id="startObs" type="button">Start server</button>
                <button class="btn" id="stopObs" type="button">Stop</button>
              </div>
              <div class="url-row hidden" id="obsUrlRow">
                <input class="url-input" id="obsUrl" type="text" readonly value="" placeholder="Server URL" />
                <button class="btn icon" id="copyObs" type="button" title="Copy URL" aria-label="Copy URL">
                  <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="4.5" y="4.5" width="8" height="8" rx="1.5" stroke="currentColor" fill="none"/><path d="M2.5 10V2.5H10" stroke="currentColor" fill="none"/></svg>
                </button>
              </div>
            </div>

            <p class="notice hidden" id="outputsNotice" role="status" aria-live="polite"></p>
          </section>
        </div>

        <footer class="app-footer">
          <span class="frame-rate" id="frameRate">-- fps</span>
          <button class="link-btn" id="checkUpdates" type="button" title="Check for updates">Check updates</button>
        </footer>
      </aside>

      <main class="viewer">
        <div class="viewer-card">
          <svg id="orcaDiagram" class="viewer-svg" viewBox="-5 175 342 205" preserveAspectRatio="xMidYMid meet" aria-label="Orca input viewer"></svg>
        </div>
      </main>
    </div>

    <div class="modal hidden" id="updateModal" role="dialog" aria-modal="true" aria-labelledby="updateTitle">
      <div class="modal-backdrop" id="updateBackdrop"></div>
      <div class="modal-card">
        <h2 class="modal-title" id="updateTitle">Update available</h2>
        <p class="modal-subtitle" id="updateSubtitle"></p>
        <pre class="modal-notes" id="updateNotes"></pre>
        <div class="button-row">
          <button class="btn" id="updateLater" type="button">Later</button>
          <button class="btn primary" id="updateNow" type="button">Update & Restart</button>
        </div>
        <p class="hint" id="updateStatus"></p>
      </div>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
