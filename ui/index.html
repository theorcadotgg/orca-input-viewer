<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orca Input Viewer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <header class="sidebar-header">
          <h1>Orca Input Viewer</h1>
          <div class="status-badges">
            <span class="status-dot" id="adapterDot"></span>
            <span class="status-label" id="adapterStatus">Offline</span>
            <span class="status-dot config" id="configDot"></span>
            <span class="status-label" id="configStatus">Default</span>
            <span class="input-mode" id="inputMode"></span>
          </div>
        </header>

        <section class="sidebar-section">
          <div class="section-row">
            <div class="inline-control">
              <label for="portSelect">Port</label>
              <select class="select-compact" id="portSelect"></select>
            </div>
            <div class="inline-control">
              <label for="profileSelect">Profile</label>
              <select class="select-compact" id="profileSelect"></select>
            </div>
          </div>
          <div class="inline-control" style="margin-bottom: 10px;">
            <label>Input Mode</label>
            <div class="toggle-group">
              <button class="toggle-btn" id="modeDolphin" data-mode="dolphin">Dolphin</button>
              <button class="toggle-btn" id="modeStandalone" data-mode="usb">Standalone</button>
            </div>
          </div>
          <div class="button-row">
            <button class="btn primary" id="startStream">Start Stream</button>
            <button class="btn" id="stopStream">Stop</button>
          </div>
          <div class="button-row hidden" id="macAccessRow">
            <button class="btn" id="enableMacAccess" type="button">Enable macOS Access</button>
          </div>
        </section>

        <section class="sidebar-section collapsible" data-section="config">
          <button class="section-toggle" type="button">
            <span>Config</span>
            <svg class="chevron" width="12" height="12" viewBox="0 0 12 12"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
          </button>
          <div class="section-content">
            <button class="btn accent" id="loadConfig">Load Device Config</button>
            <p class="hint" id="loadHint">Put Orca into config mode to sync mappings.</p>
          </div>
        </section>

        <section class="sidebar-section collapsible" data-section="overlay">
          <button class="section-toggle" type="button">
            <span>Overlay & OBS</span>
            <svg class="chevron" width="12" height="12" viewBox="0 0 12 12"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
          </button>
          <div class="section-content">
            <div class="button-row">
              <button class="btn" id="showOverlay">Show Overlay</button>
              <button class="btn ghost" id="hideOverlay">Hide</button>
            </div>
            <div class="obs-row">
              <button class="btn" id="startObs">OBS Server</button>
              <button class="btn ghost" id="stopObs">Stop</button>
            </div>
            <div class="url-row">
              <input class="url-input" id="obsUrl" type="text" readonly value="" placeholder="Server URL..." />
              <button class="btn icon" id="copyObs" title="Copy URL">
                <svg width="14" height="14" viewBox="0 0 14 14"><rect x="4" y="4" width="8" height="8" rx="1" stroke="currentColor" fill="none"/><path d="M2 10V2h8" stroke="currentColor" fill="none"/></svg>
              </button>
            </div>
          </div>
        </section>

        <footer class="sidebar-footer">
          <div class="footer-row">
            <span class="frame-rate" id="frameRate">Idle</span>
            <button class="link-btn" id="checkUpdates" type="button">Check updates</button>
          </div>
          <span class="app-version" id="appVersion"></span>
        </footer>
      </aside>

      <main class="viewer">
        <div class="viewer-card">
          <svg id="orcaDiagram" class="viewer-svg" viewBox="-5 175 342 205" preserveAspectRatio="xMidYMid meet" aria-label="Orca input viewer"></svg>
        </div>
      </main>
    </div>

    <div class="modal hidden" id="updateModal" role="dialog" aria-modal="true" aria-labelledby="updateTitle">
      <div class="modal-backdrop" id="updateBackdrop"></div>
      <div class="modal-card">
        <h2 class="modal-title" id="updateTitle">Update available</h2>
        <p class="modal-subtitle" id="updateSubtitle"></p>
        <pre class="modal-notes" id="updateNotes"></pre>
        <div class="button-row">
          <button class="btn" id="updateLater" type="button">Later</button>
          <button class="btn primary" id="updateNow" type="button">Update & Restart</button>
        </div>
        <p class="hint" id="updateStatus"></p>
      </div>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
